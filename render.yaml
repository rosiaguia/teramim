# Render Blueprint — P.A.R.E® (terAmim)
# Este arquivo faz o Render criar o site automaticamente com pouquíssimos cliques.
# Uso: no Render, escolher "New +" → "Blueprint" → conectar este repositório.
# IMPORTANTE: os arquivos do projeto devem estar na RAIZ do repositório
# (não dentro de uma subpasta).

services:
  - type: web
    name: teramim
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    disk:
      name: teramim-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: USER_LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: USER_LLM_MODEL
        value: deepseek-chat
      - key: USER_LLM_API_KEY
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: CHECKOUT_URL
        sync: false
      - key: KIWIFY_WEBHOOK_SECRET
        sync: false
